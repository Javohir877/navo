<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Navo: the letter N drawn as one unbroken sound wave.
       Left to right the colour runs from bass (warm, felt in the chest) to treble (cool, heard in the air),
       the same way Navo paints the sound it plays. The rings on the right are the note travelling outward. -->
  <defs>
    <radialGradient id="nv-bg" cx="50%" cy="22%" r="85%">
      <stop offset="0" stop-color="#2a1d5e"/>
      <stop offset=".55" stop-color="#140f2e"/>
      <stop offset="1" stop-color="#08070f"/>
    </radialGradient>
    <linearGradient id="nv-wave" gradientUnits="userSpaceOnUse" x1="12" y1="0" x2="50" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset=".38" stop-color="#ff3d7f"/>
      <stop offset=".7" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#3fd0ff"/>
    </linearGradient>
    <linearGradient id="nv-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="nv-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#nv-bg)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="17.5" fill="none" stroke="url(#nv-rim)"/>
  <g fill="none" stroke="url(#nv-wave)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 46V19c10 0 9 13.5 17 13.5S38 46 47 46V19" stroke-width="7" opacity=".55" filter="url(#nv-glow)"/>
    <path d="M14 46V19c10 0 9 13.5 17 13.5S38 46 47 46V19" stroke-width="6.2"/>
  </g>
  <g fill="none" stroke="#5fdcff" stroke-linecap="round">
    <path d="M52.6 22.4a8 8 0 0 1 0 9.2" stroke-width="2.6" opacity=".9"/>
    <path d="M56.4 19.4a13 13 0 0 1 0 15.2" stroke-width="2.2" opacity=".45"/>
  </g>
</svg>
